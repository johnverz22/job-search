# One image, three roles. `docker compose up --build` runs db, redis, migrate (one-shot), worker, api.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-jobsearch}:${POSTGRES_PASSWORD:-jobsearch}@db:5432/${POSTGRES_DB:-jobsearch}
    REDIS_URL: redis://redis:6379

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsearch}
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobsearch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    <<: *app
    command: ["node", "dist/api.js"]
    ports:
      - "8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Add sources / probe from inside the network:
  #   docker compose run --rm cli node dist/cli.js add recruitee <slug>
  cli:
    <<: *app
    command: ["node", "dist/cli.js"]
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
