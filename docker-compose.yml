# One service: crawler, API and web UI. `docker compose up --build` then open http://localhost:8080
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SNAPSHOT_FILE: /app/snapshot/jobs.ndjson.gz
    # shutdown waits up to 10s for crawls in progress and then writes the snapshot
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    volumes:
      - snapshot:/app/snapshot

volumes:
  snapshot:
