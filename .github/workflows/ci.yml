name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsearch"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI database; the DB-backed tests TRUNCATE it and refuse names without "test".
      TEST_DATABASE_URL: postgres://jobsearch:jobsearch@localhost:5432/jobsearch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Worker/DB integration scenarios
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run test:integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Also enforces the initial-JS budget and that DOMPurify stays out of the search screen's bundle.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsearch"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jobsearch:jobsearch@localhost:5432/jobsearch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Playwright starts web/e2e/serve.mjs itself (seeds the test DB, serves the SPA + API) and runs every spec at 375, 768 and 1280 px.
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
