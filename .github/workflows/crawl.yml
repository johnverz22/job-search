name: job snapshot

# Serverless deploys (Vercel) cannot run the crawl loop, so this job crawls every source once on a
# schedule and commits the result to data/jobs.snapshot. The push triggers a Vercel redeploy.
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run crawl
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.snapshot
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore: refresh job snapshot"
            git push
          fi
